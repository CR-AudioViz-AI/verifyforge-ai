name: Henderson Standards E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

  # NO `branches:` FILTER, AND NO `paths-ignore`. Both are deliberate. See #63.
  #
  # `branches:` under pull_request matches the BASE, not the head. With
  # `branches: [main]` a PR stacked on another branch was filtered out before a
  # job existed, so it got no CI at all — and an empty check list is visually
  # identical to a pending one, except that it never resolves. #57 sat in that
  # state from open to merge-time and read as "still spinning up".
  #
  # `paths-ignore` is removed because these checks are REQUIRED in branch
  # protection. A path filter that skips the whole workflow produces no check
  # run, a required check that never appears blocks the PR permanently, and the
  # fix is not discoverable from the PR page. A docs-only PR paying a minute of
  # runner time is the cheaper failure. It stays on `push`, where nothing is
  # waiting on the result.
  #
  # `edited` is here so retargeting a PR re-runs CI: pull_request builds a merge
  # commit of head+base, so changing the base invalidates every earlier run even
  # though the head SHA is untouched.
  #
  # DO NOT "optimise" `edited` with a job-level `if` that skips body-only edits.
  # A skipped job still posts a check run, and GitHub counts a skipped required
  # check as PASSING — so editing the description would paper a green over a red
  # run. Burning a runner minute is better than a green that means nothing.
  pull_request:
    types: [opened, synchronize, reopened, edited]

  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

# A run testing a commit that has already been superseded is answering a
# question nobody is asking any more. Scheduled runs are never cancelled.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    container:
      # MUST match the @playwright/test version pinned in package.json exactly.
      # The image ships the browser builds that version of the library expects;
      # when they diverge, Playwright cannot find the executables and every
      # project using a browser the image lacks fails to LAUNCH — which reads as
      # a wall of test failures rather than as a version problem.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 2026-08-27: was '20' while PRODUCTION RUNS NODE 24. A CI runtime older than
          # production means CI can pass on code that fails in production, and the
          # reverse - which is how the module-scope Supabase client's Node<22
          # WebSocket requirement produced symptoms nobody could reproduce.
          #
          # 22 is the floor that satisfies the WebSocket requirement and stays
          # within the production major.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check Playwright library and container agree
        # Fails fast with the real reason. A mismatch otherwise surfaces as
        # one failure per test, i.e. as defects in the app. See #59.
        run: node scripts/check-playwright-versions.mjs

      - name: Run E2E tests
        run: npx playwright test
        env:
          # 2026-08-27: NEXT_PUBLIC_SUPABASE_URL was never passed, so the app
          # server crashed at boot — "Error: supabaseUrl is required" — Playwright's
          # webServer never came up, and EVERY test failed. The secrets that WERE
          # passed all resolved; the missing one simply was not in the list.
          #
          # Not a secret. The URL and the anon key are public by design and are
          # inlined into the browser bundle by Next. Filing a public value as a
          # secret hides which values actually matter, so they are repo VARIABLES.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
          # The auth proof needs a real account. Absent these, e2e/auth.spec.ts
          # skips and says so loudly at collection time — it never passes
          # vacuously. A green suite with these unset proves nothing about
          # authentication, which is the state the banner exists to announce.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # The free-scan meter needs this twice over: the app under test uses it
          # to record a claim (and THROWS without it rather than running
          # unmetered), and free-scan-meter.spec.ts uses it to delete the claim
          # afterwards. The entitlement is one row per account forever, so a test
          # that consumed it without cleaning up would pass exactly once.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: test-results/
          retention-days: 7
