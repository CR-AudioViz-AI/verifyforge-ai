name: Henderson Standards E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

# A run testing a commit that has already been superseded is answering a
# question nobody is asking any more. Scheduled runs are never cancelled.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    container:
      # MUST match the @playwright/test version pinned in package.json exactly.
      # The image ships the browser builds that version of the library expects;
      # when they diverge, Playwright cannot find the executables and every
      # project using a browser the image lacks fails to LAUNCH — which reads as
      # a wall of test failures rather than as a version problem.
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check Playwright library and container agree
        # Fails fast with the real reason. A mismatch otherwise surfaces as
        # one failure per test, i.e. as defects in the app. See #59.
        run: node scripts/check-playwright-versions.mjs

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'http://localhost:3000' }}
          # The auth proof needs a real account. Absent these, e2e/auth.spec.ts
          # skips and says so loudly at collection time — it never passes
          # vacuously. A green suite with these unset proves nothing about
          # authentication, which is the state the banner exists to announce.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: test-results/
          retention-days: 7
