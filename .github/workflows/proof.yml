# .github/workflows/proof.yml
# Gate every change on the proof suite. If a claim we make to a customer stops
# being true, the merge is blocked — that is the whole point of these tests.
# CR AudioViz AI, LLC · EIN 39-3646201 · 2026-08-23
name: proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  typecheck-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci || npm install

      - name: Typecheck (strict)
        # The engine compiles clean under strict + noUncheckedIndexedAccess +
        # exactOptionalPropertyTypes. This fails the build if that ever regresses.
        run: npx tsc --noEmit -p tsconfig.engine.json

      - name: Prove — offline claims
        # No HTTP requests: lifecycle, credential deletion, SARIF interop,
        # business-logic solver, and the egress guard.
        #
        # proof.egress is security code and must gate this workflow — the guard is
        # the only thing standing between a user-supplied URL and the metadata
        # endpoint, so a regression in it cannot be allowed to pass silently.
        # It issues no HTTP requests, but guardUrl() resolves DNS (example.com and
        # localhost.localtest.me), so this step needs name resolution even though
        # it needs no reachable site. That is why it is here and not in live claims.
        run: |
          npx tsx test/proof.lifecycle.ts
          npx tsx test/proof.credentials.ts
          npx tsx test/proof.sarif.ts
          npx tsx test/proof.solver.ts
          npx tsx test/proof.egress.ts

      - name: Prove — live claims
        # These hit real sites (example.com, docs.claude.com). Allowed to be flaky
        # on network, but a genuine logic regression still fails them. Retried once.
        run: npx tsx test/proof.claims.ts || npx tsx test/proof.claims.ts
