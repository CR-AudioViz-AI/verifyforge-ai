# .github/workflows/proof.yml
# Gate every change on the proof suite. If a claim we make to a customer stops
# being true, the merge is blocked — that is the whole point of these tests.
# CR AudioViz AI, LLC · EIN 39-3646201 · 2026-08-23
name: proof

on:
  # No `branches:` filter — it matches the BASE, so a PR stacked on another
  # branch got no CI at all, silently. `edited` re-runs on a retarget, because
  # pull_request builds a merge commit of head+base and changing the base
  # invalidates every earlier run. See #63 and the fuller note in e2e-tests.yml.
  pull_request:
    types: [opened, synchronize, reopened, edited]

  # NARROWED from [main, 'feat/**'] to [main]. A branch matching feat/** used to
  # produce a SECOND check run also called `typecheck-and-prove` — one from this
  # push trigger, one from pull_request — and PR #56 carried both. Branch
  # protection matches a required check BY NAME, so two runs sharing one name is
  # ambiguous exactly where ambiguity is most expensive. Every PR now runs this
  # once, via pull_request; push covers main after merge.
  push:
    branches: [main]

jobs:
  typecheck-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # 2026-08-27: was '20' while PRODUCTION RUNS NODE 24. A CI runtime older than
          # production means CI can pass on code that fails in production, and the
          # reverse - which is how the module-scope Supabase client's Node<22
          # WebSocket requirement produced symptoms nobody could reproduce.
          #
          # 22 is the floor that satisfies the WebSocket requirement and stays
          # within the production major.
          node-version: '22'

      - name: Install
        run: npm ci || npm install

      - name: Typecheck (strict)
        # The engine compiles clean under strict + noUncheckedIndexedAccess +
        # exactOptionalPropertyTypes. This fails the build if that ever regresses.
        run: npx tsc --noEmit -p tsconfig.engine.json

      # 2026-08-27: THE APP WAS NEVER TYPECHECKED — only tsconfig.engine.json was,
      # so app/, components/ and every platform-sdk import went unchecked. The SDK
      # had 24 type errors including an auth guard that was always false, so every
      # app using the shared header rendered signed-out for a signed-in customer.
      #
      # The engine check stays: it is faster and fails first on the pattern maths.
      - name: Typecheck the app
        run: ./node_modules/.bin/tsc --noEmit

      - name: Prove — offline claims
        # No EXTERNAL network: lifecycle, credential deletion, SARIF interop,
        # business-logic solver, the egress guard, and the web scan.
        #
        # "No HTTP requests" was the old wording and it was not true even then —
        # proof.credentials reaches example.com, and reports the resulting
        # failure as an authorization defect (#67). proof.webscan does make HTTP
        # requests, to a server it starts itself on 127.0.0.1, depending on no
        # third party. The distinction that matters for this group is external
        # dependency, not the protocol, so the comment now says that.
        #
        # proof.egress is security code and must gate this workflow — the guard is
        # the only thing standing between a user-supplied URL and the metadata
        # endpoint, so a regression in it cannot be allowed to pass silently.
        # It issues no HTTP requests, but guardUrl() resolves DNS (example.com and
        # localhost.localtest.me), so this step needs name resolution even though
        # it needs no reachable site. That is why it is here and not in live claims.
        run: |
          npx tsx test/proof.lifecycle.ts
          npx tsx test/proof.credentials.ts
          npx tsx test/proof.sarif.ts
          npx tsx test/proof.solver.ts
          npx tsx test/proof.egress.ts
          npx tsx test/proof.entitlements.ts
          npx tsx test/proof.webscan.ts

      - name: Prove — live claims
        # These hit real sites (example.com, docs.claude.com). Allowed to be flaky
        # on network, but a genuine logic regression still fails them. Retried once.
        run: npx tsx test/proof.claims.ts || npx tsx test/proof.claims.ts
