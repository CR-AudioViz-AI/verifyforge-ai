name: "CodeQL Security Scan"

on:
  push:
    branches: [ main ]
  # No `branches:` filter — see #63. It matched the BASE, so a stacked PR was
  # never analysed. The old list also named master and develop, neither of which
  # exists in this repository.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '0 4 * * 1' # Weekly on Mondays at 4 AM

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 2026-08-12: was [ 'javascript', 'typescript' ] — two jobs running
        # the identical analysis. GitHub merged them into one language.
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
      with:
        category: "/language:${{matrix.language}}"
